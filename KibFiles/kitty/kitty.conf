font_family Hack Nerd Font
bold_font auto
italic_font auto
bold_italic_font auto

font_size 14

background_opacity 0.9
background_blur 0

window_padding_width 14

window_border_width 2
window_margin_width 6

foreground            #eaeaea
background            #111111

selection_foreground  #111111
selection_background  #89b4fa

cursor                #89b4fa
cursor_text_color     #111111

active_border_color   #89b4fa
inactive_border_color #2a2a2a

# Black
color0  #1a1a1a
color8  #555555

# Red
color1  #f38ba8
color9  #f38ba8

# Green
color2  #a6e3a1
color10 #a6e3a1

# Yellow
color3  #f9e2af
color11 #f9e2af

# Blue
color4  #89b4fa
color12 #89b4fa

# Magenta
color5  #f5c2e7
color13 #f5c2e7

# Cyan
color6  #94e2d5
color14 #94e2d5

# White
color7  #eaeaea
color15 #ffffff

enable_audio_bell no
visual_bell_duration 0

cursor_shape block
cursor_blink_interval 0

scrollback_lines 5000

tab_bar_style powerline
tab_powerline_style round
tab_bar_show_new_tab_button yes

tab_bar_min_tabs 0

wheel_scroll_multiplier 5.0
linux_display_server wayland
